name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # image.yml runs all of this before it publishes

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the oldest Node that strips types without a flag.
        node: ['22.18', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The camera tests skip themselves without ffmpeg. Not here.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-hermit
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: npm test (nothing may be skipped)
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -Eq '^(# |ℹ )skipped 0$' "$RUNNER_TEMP/test.log"
      - run: npm run build
      - name: The npm package holds dist, README, LICENSE and package.json only
        if: matrix.node == '22'
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.argv[1])[0].files.map((f) => f.path);
            const odd = files.filter((p) => !/^(dist\/.+\.js|README\.md|LICENSE|package\.json)$/.test(p));
            if (odd.length > 0 || !files.includes("dist/cli.js")) { console.error("unexpected package contents:", odd); process.exit(1); }
            console.log(files.length + " files");
          ' "$RUNNER_TEMP/pack.json"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bamboozle:ci
      - name: Smoke test
        run: |
          docker run --rm bamboozle:ci --help
          docker run --rm --entrypoint sh bamboozle:ci -c \
            'fc-match -f "%{file}\n" Hermit:bold | grep -i hermit && ffmpeg -hide_banner -encoders | grep -q libx264'
      - name: Build for arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
