# bamboozle, plus go2rtc to relay the printer's camera.
#
#   mkdir -m 700 data                        # once, next to this file
#   docker compose run --rm bamboozle init   # once: printer address and access code
#   docker compose up -d
#   docker compose logs -f bamboozle         # the pairing QR code
#
# Both use the host network: the Home app finds the bridge with mDNS, and
# live video goes over UDP to whatever port the viewer picks.
services:
  bamboozle:
    image: ghcr.io/nxmxbbd/bamboozle:latest
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Etc/UTC # your time zone, for the finish time on the camera overlay
    # The image runs as uid 1000: ./data must be writable for it (see the README).
    volumes:
      - ./data:/data # config, access code and the bridge's pairing keys
    # Hardware encoding on an Intel GPU ("camera": { "encoder": "vaapi" }):
    # pass the GPU in, plus the group that owns it.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "123" # the render group's id: getent group render | cut -d: -f3

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
